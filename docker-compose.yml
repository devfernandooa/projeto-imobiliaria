# docker-compose.yml
services:
  # 1. Serviço da Aplicação (PHP/Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    tty: true
    environment:
      # Variável para ambiente Laravel, pode ser 'local' ou 'staging'
      SERVICE_NAME: app
      #MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      #MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - .:/var/www/html:cached # Monta o código local no contêiner
    networks:
      - app-network

  # 2. Serviço do Nginx (Servidor Web)
  nginx:
    image: nginx:stable-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80" # Mapeia a porta 80 do host para a porta 80 do Nginx
    volumes:
      - .:/var/www/html # Compartilha o código
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Configuração do Nginx
    depends_on:
      - app
    networks:
      - app-network

  # 3. Serviço do Banco de Dados (MySQL)
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql # Volume persistente para os dados do DB
    ports:
      - "3306:3306" # Opcional: Mapeia para o host
    networks:
      - app-network

# Redes e Volumes
volumes:
  dbdata: ~ # Define o volume persistente

networks:
  app-network:
    driver: bridge